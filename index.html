<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE NEST — $EGG</title>
<meta name="description" content="THE NEST ($EGG) — climb the Leonida radio tower, find the nest, drop the egg on the sleazy lawyer.">
<style>
:root{--pink:#ff2e93;--org:#ff9a3c;--teal:#19e6d2;--ink:#12051f;--cream:#fff3d6;--gold:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--cream);font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 12px;background:linear-gradient(90deg,#2a0a55,#5a1170);border-bottom:2px solid var(--pink);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;font-family:Impact,'Arial Black',sans-serif;letter-spacing:1px}
.brand span{font-size:1.35rem;color:var(--cream)}
.brand b{font-size:1.35rem;color:var(--gold);text-shadow:0 0 10px var(--org)}
.brand i{font-style:normal;font-size:.7rem;color:var(--teal);border:1px solid var(--teal);padding:2px 6px;border-radius:99px}
.ca{display:flex;align-items:center;gap:6px;background:#0d0318;border:1px solid var(--teal);border-radius:8px;padding:4px 8px;cursor:pointer;max-width:100%;min-width:0}
.ca span{font-size:.65rem;background:var(--teal);color:#0d0318;font-weight:bold;padding:1px 5px;border-radius:4px}
.ca code{font-size:.72rem;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
nav a,nav button{font:bold .75rem 'Trebuchet MS',Verdana,sans-serif;color:var(--cream);text-decoration:none;background:transparent;border:1px solid var(--pink);padding:5px 10px;border-radius:6px;cursor:pointer}
nav a:hover,nav button:hover{background:var(--pink)}
nav a.buy{background:var(--gold);color:#2a0a55;border-color:var(--gold)}
nav a.buy:hover{background:var(--org)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a0c63,#12051f 70%)}
#wrap{position:relative;box-shadow:0 0 40px rgba(255,46,147,.35);border:2px solid var(--pink);border-radius:10px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,5,31,.74);padding:3%}
.card{text-align:center;max-width:34em;border:2px solid var(--teal);border-radius:1em;background:linear-gradient(160deg,#2a0a55ee,#12051fee);padding:1.1em 1.4em;box-shadow:0 0 30px rgba(25,230,210,.35)}
.card h1{font-family:Impact,'Arial Black',sans-serif;font-size:2.6em;line-height:1;color:var(--gold);text-shadow:0 0 16px var(--org),3px 3px 0 var(--pink);letter-spacing:2px}
.card h2{font-family:Impact,'Arial Black',sans-serif;font-size:1.2em;color:var(--teal);margin:.4em 0;letter-spacing:2px}
.card p{font-size:.95em;line-height:1.45;margin:.5em 0;color:var(--cream)}
.card small{display:block;font-size:.75em;color:#c9b6e6;margin-top:.5em}
.btns{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;margin-top:.8em}
.btn{font:bold 1em Impact,'Arial Black',sans-serif;letter-spacing:1.5px;text-decoration:none;color:#2a0a55;background:linear-gradient(180deg,var(--gold),var(--org));border:0;border-radius:.6em;padding:.6em 1.3em;cursor:pointer;box-shadow:0 4px 0 #b04a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b04a00}
.btn.alt{background:linear-gradient(180deg,#ff6fb5,var(--pink));color:#fff;box-shadow:0 4px 0 #8f0f52}
footer{height:26px;overflow:hidden;background:#0d0318;border-top:1px solid var(--pink);display:flex;align-items:center;z-index:5}
.tick{white-space:nowrap;font-size:.72rem;color:var(--teal);letter-spacing:2px;animation:mq 28s linear infinite}
@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--teal);color:#0d0318;font-weight:bold;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header id="hd">
  <div class="brand"><span id="tn"></span><b id="tk"></b><i id="ch"></i></div>
  <div class="ca" id="ca" title="Click to copy contract address"><span>CA</span><code id="cav"></code></div>
  <nav>
    <a id="lx" target="_blank" rel="noopener noreferrer">X</a>
    <a id="lc" target="_blank" rel="noopener noreferrer">CHART</a>
    <a id="lb" class="buy" target="_blank" rel="noopener noreferrer">BUY</a>
    <button id="mute" type="button">SOUND: ON</button>
  </nav>
</header>
<main>
  <div id="wrap">
    <canvas id="cv" width="800" height="600"></canvas>
    <div id="ov"></div>
  </div>
</main>
<footer id="ft"><div class="tick" id="tick"></div></footer>
<div id="toast"></div>

<script>
// ============================================================
//  LAUNCH CONFIG — REPLACE THESE VALUES AT LAUNCH (5 SECONDS)
// ============================================================
const CONFIG = {
  TOKEN_NAME: "THE NEST",
  TICKER: "$EGG",
   CHAIN: "SOLANA // PUMP.FUN",
  CONTRACT_ADDRESS: "YOUR_PUMPFUN_CA",
  TWITTER_URL: "https://x.com/YOUR_X_HANDLE",
  CHART_URL: "https://dexscreener.com/solana/YOUR_PUMPFUN_CA",
  BUY_URL: "https://pump.fun/coin/YOUR_PUMPFUN_CA"
};

(function(){
'use strict';
const W=800,H=600;
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),wrap=$('wrap'),ovEl=$('ov');
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- config -> UI ---------- */
document.title=CONFIG.TOKEN_NAME+' — '+CONFIG.TICKER;
$('tn').textContent=CONFIG.TOKEN_NAME;
$('tk').textContent=CONFIG.TICKER;
$('ch').textContent=CONFIG.CHAIN;
$('cav').textContent=CONFIG.CONTRACT_ADDRESS;
$('lx').href=CONFIG.TWITTER_URL;
$('lc').href=CONFIG.CHART_URL;
$('lb').href=CONFIG.BUY_URL;
$('lb').textContent='BUY '+CONFIG.TICKER;
const tickTxt=(CONFIG.TICKER+'  ///  '+CONFIG.TOKEN_NAME+'  ///  '+CONFIG.CHAIN+'  ///  CLIMB THE TOWER  ///  FIND THE NEST  ///  DROP THE EGG  ///  ').repeat(4);
$('tick').textContent=tickTxt;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600);}
function copyCA(){
  const s=CONFIG.CONTRACT_ADDRESS;
  const fb=()=>{const a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Contract copied!');}catch(e){toast('Copy failed');}document.body.removeChild(a);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast('Contract copied!'),fb);}else fb();
}
$('ca').addEventListener('click',copyCA);

/* ---------- fit ---------- */
function fit(){
  const hh=$('hd').offsetHeight+$('ft').offsetHeight;
  const s=Math.min(innerWidth/W,(innerHeight-hh-8)/H);
  const w=Math.max(280,W*s);
  wrap.style.width=w+'px';wrap.style.height=(w*H/W)+'px';
  wrap.style.fontSize=(16*clamp(w/800*1.1,.55,1.2))+'px';
}
addEventListener('resize',fit);fit();

/* ---------- AUDIO ---------- */
let AC=null,master=null,noiseBuf=null,muted=false,musicT=null,mstep=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    startMusic();
  }catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v==null?.2:v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,f0,f1,type,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type=type||'lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);
}
const sfx={
  climb:p=>{tone(180+p*260,.07,'square',.12);noise(.05,.08,1800,600,'bandpass');},
  slip:()=>{tone(150,.15,'sawtooth',.12,-90);},
  hurt:()=>{noise(.3,.35,1500,120,'lowpass');tone(160,.3,'sawtooth',.18,-110);},
  throw:()=>{noise(.45,.2,500,5000,'highpass');},
  splat:()=>{noise(.3,.45,3000,150,'lowpass');tone(140,.22,'sine',.35,-100);tone(90,.3,'sine',.25,-50,.05);},
  thud:()=>{noise(.18,.28,900,90,'lowpass');tone(110,.14,'sine',.22,-60);},
  cluck:()=>{tone(520,.07,'square',.1,260);tone(700,.08,'square',.1,-200,.08);tone(560,.09,'square',.1,200,.18);},
  pick:()=>{[392,523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.18,0,i*.07));},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.18,'square',.13,0,i*.1));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.14,0,i*.18));},
  beep:()=>{tone(880,.09,'square',.1);}
};
const BASS=[55,55,65.4,65.4,49,49,58.3,58.3],ARP=[220,261.6,329.6,261.6,196,246.9,293.7,246.9];
function startMusic(){
  if(musicT)return;
  musicT=setInterval(()=>{
    if(!AC||muted||document.hidden)return;
    const i=mstep%8;
    tone(BASS[i]*2,.2,'sawtooth',.07);
    if(mstep%2===0)tone(ARP[i]*2,.11,'square',.028);
    if(mstep%4===0)tone(130,.12,'sine',.2,-90);
    if(mstep%4===2)noise(.05,.06,7000,7000,'highpass');
    mstep++;
  },170);
}
$('mute').addEventListener('click',()=>{
  muted=!muted;$('mute').textContent='SOUND: '+(muted?'OFF':'ON');
  if(master)master.gain.value=muted?0:.55;
  initAudio();
});

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function txt(s,x,y,size,col,al,stroke){
  cx.font=size+"px Impact,'Arial Black',sans-serif";cx.textAlign=al||'left';cx.textBaseline='middle';
  if(stroke){cx.lineWidth=size/5;cx.strokeStyle=stroke;cx.lineJoin='round';cx.strokeText(s,x,y);}
  cx.fillStyle=col;cx.fillText(s,x,y);
}
const SKY=[[0,[24,5,60]],[.5,[150,34,125]],[.8,[255,100,90]],[1,[255,178,72]]];
function skyAt(y){
  const k=clamp(y/H,0,1);
  for(let i=1;i<SKY.length;i++){
    if(k<=SKY[i][0]){const a=SKY[i-1],b=SKY[i],f=(k-a[0])/(b[0]-a[0]);
      return 'rgb('+a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*f)).join(',')+')';}
  }
  return 'rgb(255,178,72)';
}
let skyG=null;
function drawSky(){
  if(!skyG){skyG=cx.createLinearGradient(0,0,0,H);SKY.forEach(s=>skyG.addColorStop(s[0],'rgb('+s[1].join(',')+')'));}
  cx.fillStyle=skyG;cx.fillRect(0,0,W,H);
  for(const s of STARS){
    const a=.4+.6*Math.abs(Math.sin(T*s.sp+s.ph));
    cx.fillStyle='rgba(255,243,214,'+a*.8+')';cx.fillRect(s.x,s.y,s.r,s.r);
  }
}
function drawSun(x,y,r){
  cx.save();cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.clip();
  const g=cx.createLinearGradient(0,y-r,0,y+r);g.addColorStop(0,'#fff27a');g.addColorStop(.5,'#ff9a3c');g.addColorStop(1,'#ff2e93');
  cx.fillStyle=g;cx.fillRect(x-r,y-r,r*2,r*2);
  for(let i=0;i<7;i++){const yy=y+r*.05+i*r*.15;cx.fillStyle=skyAt(yy);cx.fillRect(x-r,yy,r*2,2+i*1.6);}
  cx.restore();
}
function cloud(x,y,s,a){
  cx.fillStyle='rgba(255,190,220,'+a+')';
  cx.beginPath();cx.ellipse(x,y,60*s,16*s,0,0,7);cx.ellipse(x-30*s,y+4*s,36*s,12*s,0,0,7);cx.ellipse(x+34*s,y+5*s,40*s,12*s,0,0,7);cx.fill();
}

/* ---------- static world gen ---------- */
const STARS=[];for(let i=0;i<70;i++)STARS.push({x:R(0,W),y:R(0,H*.42),r:R(1,2.4),sp:R(.8,3),ph:R(0,6)});
const CLOUDS=[];for(let i=0;i<14;i++)CLOUDS.push({x:R(0,W),h:R(250,4400),s:R(.7,1.6),v:R(5,18)});
const CITY=[];for(let x=-20;x<W+60;){const w=R(36,78);CITY.push({x:x,w:w,h:R(50,230),n:Math.floor(R(0,99))});x+=w+R(2,10);}
const PALMS=[{x:262,h:150},{x:340,h:120},{x:690,h:140},{x:770,h:170}];

/* ---------- state ---------- */
const PY=420,GY=548,OX=92,OY=150,G=900;
let state='menu',T=0,last=0,score=0,best=0,level=1,combo=0;
try{best=+localStorage.getItem('egg_best')||0;}catch(e){}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('egg_best',String(best));}catch(e){}}}
let shake=0,flash=0;
// climb
let prog=0,side=0,lastSide=-1,lives=3,inv=0,stumble=0,dTimer=1,debris=[],warn=[],cph=0,cphS=0,px=360,trans=0;
// throw
let eggsLeft=5,thrown=0,hits=0,proj=null,aiming=false,mx=0,my=0,waitT=0,roundEnded=false,wind=0,stains=[],parts=[],floats=[],lawyer=null,firstThrow=true;
const EGGS=[
  {c:'#ff5fa2',p:'stripes'},{c:'#35e0d0',p:'dots'},{c:'#ffd23f',p:'zig'},{c:'#a678ff',p:'heart'},{c:'#ffe680',p:'star',gold:true}
];
const NESTPOS=[[-30,-5],[-12,-9],[8,-6],[28,-3],[0,-15]];
const L_IDLE=["I BILL BY THE MINUTE","SUE FIRST. ASK LATER.","CALL 1-800-SUE-ALL","EGGS ARE NOT LEGAL TENDER","I'M NOT SLEAZY, I'M BILLABLE"];
const L_HIT=["OBJECTION!!","MY SUIT!! $4000!!","I'LL SUE THE BIRD!","THE EGG IS EVIDENCE!","THAT'S ASSAULT!"];
const L_MISS=["MISSED ME, JUNIOR","SEE YOU IN COURT","HA! OVERRULED","SWING AND A MISS"];

function newLawyer(){
  lawyer={x:520,dir:1,ph:0,st:'walk',tm:0,bub:'',bt:0,turnT:R(1,2.5),spd:60+level*22,yolk:null,idleT:R(2,4)};
}
function say(a,d){lawyer.bub=a[Math.floor(Math.random()*a.length)];lawyer.bt=d||2;}

/* ---------- overlay ---------- */
function showOv(title,sub,body,btns,foot){
  let h='<div class="card"><h1>'+title+'</h1>';
  if(sub)h+='<h2>'+sub+'</h2>';
  if(body)h+='<p>'+body+'</p>';
  h+='<div class="btns">';
  btns.forEach((b,i)=>{
    if(b.href)h+='<a class="btn '+(b.cls||'')+'" target="_blank" rel="noopener noreferrer" href="'+b.href+'">'+b.t+'</a>';
    else h+='<button type="button" class="btn '+(b.cls||'')+'" data-i="'+i+'">'+b.t+'</button>';
  });
  h+='</div>';
  if(foot)h+='<small>'+foot+'</small>';
  h+='</div>';
  ovEl.innerHTML=h;ovEl.style.display='flex';
  ovEl.querySelectorAll('button[data-i]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();initAudio();btns[+el.dataset.i].fn();});
  });
  const f=ovEl.querySelector('button[data-i]');if(f)f.focus();
}
function hideOv(){ovEl.style.display='none';ovEl.innerHTML='';}
function shareURL(){
  const t='I scored '+score+' on '+CONFIG.TOKEN_NAME+' '+CONFIG.TICKER+' — climbed the tower and egged the lawyer. CA: '+CONFIG.CONTRACT_ADDRESS;
  return 'https://twitter.com/intent/tweet?text='+encodeURIComponent(t);
}
function menu(){
  state='menu';newLawyer();eggsLeft=5;thrown=0;proj=null;aiming=false;stains=[];parts=[];floats=[];wind=0;
  showOv(CONFIG.TOKEN_NAME,CONFIG.TICKER+' // '+CONFIG.CHAIN,
    'Climb the massive Leonida radio tower. Find the giant nest full of painted eggs. Then drop them on the sleazy lawyer below.',
    [{t:'CLIMB THE TOWER',fn:startClimb},{t:'BUY '+CONFIG.TICKER,href:CONFIG.BUY_URL,cls:'alt'}],
    'CLIMB: tap LEFT / RIGHT (or ← → / A D) alternately. THROW: drag &amp; release. Best: '+best);
}

/* ---------- CLIMB ---------- */
function startClimb(){
  initAudio();hideOv();state='climb';prog=0;side=0;lastSide=-1;lives=3;inv=0;stumble=0;debris=[];warn=[];dTimer=1.4;cph=0;cphS=0;px=360;
  score=0;level=1;combo=0;shake=0;flash=0;sfx.beep();
}
function press(s){
  if(state!=='climb')return;
  if(s===lastSide){stumble=.3;prog=Math.max(0,prog-.008);sfx.slip();return;}
  lastSide=s;side=s;cph++;
  prog=Math.min(1,prog+.022);sfx.climb(prog);
  if(prog>=1){state='trans';trans=1.7;sfx.pick();setTimeout(sfx.win,350);}
}
function hurt(){
  lives--;prog=Math.max(0,prog-.05);inv=1;shake=.4;flash=.35;sfx.hurt();
  if(lives<=0){
    state='result';sfx.lose();saveBest();
    showOv('YOU FELL!','THE TOWER WINS THIS ONE','A rusty bolt knocked you off the Leonida radio tower. The lawyer sends his regards.',
      [{t:'CLIMB AGAIN',fn:startClimb}],'Best: '+best);
  }
}
function updClimb(dt){
  if(inv>0)inv-=dt;if(stumble>0)stumble-=dt;
  cphS+=(cph-cphS)*Math.min(1,dt*12);
  px+=((side?440:360)-px)*Math.min(1,dt*18);
  dTimer-=dt;
  if(dTimer<=0){warn.push({r:Math.random()<.5?0:1,t:.7});dTimer=Math.max(.4,1.15-prog*.55)+Math.random()*.45;}
  for(const w of warn){w.t-=dt;if(w.t<=0)debris.push({r:w.r,y:-30,rot:0,k:Math.floor(Math.random()*3),done:false});}
  warn=warn.filter(w=>w.t>0);
  for(const d of debris){
    d.y+=(330+prog*230)*dt;d.rot+=dt*6;
    if(!d.done&&d.r===side&&Math.abs(d.y-PY)<30&&inv<=0&&state==='climb'){d.done=true;hurt();}
  }
  debris=debris.filter(d=>d.y<H+40&&!d.done);
}
function drawClimber(x,y,ph){
  const sw=Math.sin(ph*Math.PI);
  cx.save();cx.translate(x,y);
  if(inv>0&&Math.floor(T*14)%2===0)cx.globalAlpha=.45;
  cx.lineCap='round';
  cx.strokeStyle='#1c1c3a';cx.lineWidth=7;
  cx.beginPath();cx.moveTo(-6,18);cx.lineTo(-8,36+sw*6);cx.moveTo(6,18);cx.lineTo(8,36-sw*6);cx.stroke();
  cx.fillStyle='#ff2e93';rr(-14,-10,28,32,8);cx.fill();
  cx.fillStyle='#19e6d2';rr(-9,-4,18,18,4);cx.fill();
  cx.strokeStyle='#ffd0a8';cx.lineWidth=6;
  cx.beginPath();cx.moveTo(-13,-6);cx.lineTo(-17,-26+sw*8);cx.moveTo(13,-6);cx.lineTo(17,-26-sw*8);cx.stroke();
  cx.fillStyle='#f2b693';cx.beginPath();cx.arc(0,-20,10,0,7);cx.fill();
  cx.fillStyle='#ffd23f';cx.beginPath();cx.arc(0,-22,10.5,Math.PI,0);cx.fill();cx.fillRect(-11,-23,22,4);
  cx.restore();
}
function drawNestShape(x,y,s,eggsN){
  cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle='#4a2c12';cx.beginPath();cx.ellipse(0,6,62,20,0,0,7);cx.fill();
  for(let i=0;i<eggsN;i++){const p=NESTPOS[i];drawEgg(p[0],p[1],10,EGGS[i],Math.sin(i*2.3)*.4);}

function drawEgg(x,y,r,def,rot){

  if(def.p==='stripes'){cx.fillRect(-r,-r*.35,r*2,r*.22);cx.fillRect(-r,r*.2,r*2,r*.22);}

  else if(def.p==='zig'){cx.beginPath();for(let i=0;i<7;i++){const xx=-r+i*r/3;cx.lineTo(xx,i%2?r*.05:-r*.2);}cx.stroke();cx.beginPath();for(let i=0;i<7;i++){const xx=-r+i*r/3;cx.lineTo(xx,i%2?r*.5:r*.25);}cx.stroke();}
  else if(def.p==='heart'){cx.font=(r*.95)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('♥',0,r*.05);}

  cx.restore();
  cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=1.2;cx.beginPath();cx.ellipse(0,0,r*.78,r,0,0,7);cx.stroke();
  cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.ellipse(-r*.28,-r*.38,r*.14,r*.28,.4,0,7);cx.fill();

  txt('NEST '+level,16,52,20,'#19e6d2','left','#12051f');
  txt('BEST '+best,W-16,24,22,'#ffd23f','right','#12051f');
  txt('HITS '+hits+'/3 TO ADVANCE',W-16,50,18,hits>=3?'#19e6d2':'#fff3d6','right','#12051f');
  for(let i=0;i<5;i++){drawEgg(24+i*26,82,9,EGGS[i],0);if(i<thrown){cx.fillStyle='rgba(18,5,31,.7)';cx.beginPath();cx.ellipse(24+i*26,82,8,10,0,0,7);cx.fill();}}
  // wind
  const wx=W/2,wy=30;
  txt('WIND',wx-60,wy,18,'#19e6d2','center','#12051f');
  const len=clamp(wind*.9,-80,80);
  cx.strokeStyle='#ffd23f';cx.lineWidth=5;cx.lineCap='round';
  cx.beginPath();cx.moveTo(wx,wy);cx.lineTo(wx+len,wy);cx.stroke();
  if(Math.abs(len)>4){const d=len>0?1:-1;cx.beginPath();cx.moveTo(wx+len,wy);cx.lineTo(wx+len-d*10,wy-7);cx.moveTo(wx+len,wy);cx.lineTo(wx+len-d*10,wy+7);cx.stroke();}
  txt(Math.abs(Math.round(wind))+(wind>0?' →':wind<0?' ←':''),wx+60,wy,18,'#fff3d6','center','#12051f');
  if(combo>1)txt('COMBO x'+combo,W/2,62,22,'#ff2e93','center','#12051f');
  if(firstThrow&&thrown===0&&state==='throw'){
    txt('DRAG & RELEASE TO LOB THE EGG',W/2,250,28,'#fff3d6','center','#7a1f55');
    txt('FARTHER DRAG = MORE POWER  •  WATCH THE WIND',W/2,282,18,'#19e6d2','center','#12051f');
  }
}
function updThrow(dt){
  updLawyer(dt);
  if(waitT>0)waitT-=dt;
  if(proj){
    const steps=4,h=dt/steps;
    for(let i=0;i<steps&&proj;i++){
      proj.vy+=G*h;proj.vx+=wind*h;proj.x+=proj.vx*h;proj.y+=proj.vy*h;proj.rot+=h*9;
      if(lawyer.st==='walk'&&Math.abs(proj.x-lawyer.x)<22+9&&proj.y>GY-98&&proj.y<GY+4){lawyerHit(proj.def,proj.y<GY-68);break;}
      if(proj.y>=GY){
        if(lawyer.st==='walk'&&Math.abs(proj.x-lawyer.x)<34){proj.y=GY-20;lawyerHit(proj.def,false);}
        else eggMiss();
        break;
      }
      if(proj.x>W+60||proj.x<-60){eggMiss();break;}
    }
  }
  if(!proj&&eggsLeft===0&&waitT<=0&&!roundEnded){roundEnded=true;endRound();}
}
function endRound(){
  if(hits>=3){
    const bonus=250*level;score+=bonus;saveBest();sfx.win();
    showOv('NEST '+level+' CLEAR!','LAWYER: SUFFICIENTLY SCRAMBLED',
      'You landed '+hits+'/5 eggs. Clear bonus +'+bonus+'. The lawyer is faster and the wind is meaner next round.',
      [{t:'NEXT NEST',fn:function(){level++;startThrow();}},{t:'SHARE ON X',href:shareURL(),cls:'alt'}],
      'Score: '+score+' • Best: '+best);
  }else{
    saveBest();sfx.lose();state='result';
    showOv('CASE DISMISSED','THE LAWYER WALKS FREE',
      'Only '+hits+'/5 eggs landed — you need 3. Final score: '+score+'.',
      [{t:'CLIMB AGAIN',fn:startClimb},{t:'SHARE ON X',href:shareURL(),cls:'alt'},{t:'BUY '+CONFIG.TICKER,href:CONFIG.BUY_URL,cls:'alt'}],
      'Best: '+best+' • '+CONFIG.TICKER+' '+CONFIG.CHAIN);
  }
}
function updFx(dt){
  for(const p of parts){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.y>GY+2&&state!=='climb'){p.y=GY+2;p.vy*=-.2;p.vx*=.6;}}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=40*dt;f.l-=dt;}
  floats=floats.filter(f=>f.l>0);
  if(shake>0)shake-=dt;if(flash>0)flash-=dt;
}
function drawFx(){
  for(const p of parts){cx.globalAlpha=clamp(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);}
  cx.globalAlpha=1;
  for(const f of floats){cx.globalAlpha=clamp(f.l*1.5,0,1);txt(f.s,f.x,f.y,24,f.c,'center','#12051f');}
  cx.globalAlpha=1;
}

/* ---------- main loop ---------- */
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  cx.save();
  if(shake>0)cx.translate(R(-5,5),R(-5,5));
  if(state==='climb'){updClimb(dt);updFx(dt);drawClimb();}
  else if(state==='trans'){
    trans-=dt;updFx(dt);cphS+=(cph-cphS)*Math.min(1,dt*12);drawClimb();
    cx.fillStyle='rgba(18,5,31,'+clamp(1-trans/1.7,0,.55)+')';cx.fillRect(0,0,W,H);
    txt('YOU MADE IT!',W/2,230,56,'#ffd23f','center','#7a1f55');
    txt('THE NEST IS FULL OF PAINTED EGGS...',W/2,290,24,'#fff3d6','center','#12051f');
    txt('FIND THE LAWYER.',W/2,326,28,'#19e6d2','center','#12051f');
    if(trans<=0)startThrow();
  }
  else{
    if(state==='menu'){updLawyer(dt);}
    else updThrow(dt);
    updFx(dt);
    drawScene();
    drawLawyer();
    if(state!=='menu'||true)drawThrowerAndNest();
    if(proj){drawEgg(proj.x,proj.y,11,proj.def,proj.rot);}
    if(aiming&&!proj&&eggsLeft>0){
      const dx=mx-OX,dy=my-OY,d=Math.hypot(dx,dy),dd=Math.min(d,300),a=Math.atan2(dy,dx);
      const vx=Math.cos(a)*dd*2.9,vy=Math.sin(a)*dd*2.9;
      trajectory(vx,vy);
      const pw=dd/300;cx.strokeStyle='rgb('+Math.round(25+230*pw)+','+Math.round(230-184*pw)+','+Math.round(210-60*pw)+')';
      cx.lineWidth=4;cx.setLineDash([8,6]);cx.beginPath();cx.moveTo(OX,OY);cx.lineTo(OX+Math.cos(a)*dd,OY+Math.sin(a)*dd);cx.stroke();cx.setLineDash([]);
      txt(Math.round(pw*100)+'%',OX+Math.cos(a)*dd+14,OY+Math.sin(a)*dd-14,18,'#fff3d6','left','#12051f');
    }
    drawFx();
    if(state==='throw'||state==='result')drawThrowHUD();
    if(state==='menu'){txt(CONFIG.TICKER,W-16,24,26,'#ffd23f','right','#12051f');}
  }
  cx.restore();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  initAudio();const p=pos(e);
  if(state==='climb'){press(p.x<W/2?0:1);e.preventDefault();return;}
  if(state==='throw'&&!proj&&eggsLeft>0&&waitT<=0&&!roundEnded){
    aiming=true;mx=p.x;my=p.y;try{cv.setPointerCapture(e.pointerId);}catch(er){}e.preventDefault();
  }
});
cv.addEventListener('pointermove',e=>{if(aiming){const p=pos(e);mx=p.x;my=p.y;}});
function release(e){
  if(!aiming)return;aiming=false;
  const p=pos(e);mx=p.x;my=p.y;
  const dx=mx-OX,dy=my-OY,d=Math.hypot(dx,dy);
  if(d<30||state!=='throw'||proj||eggsLeft<=0)return;
  const dd=Math.min(d,300),a=Math.atan2(dy,dx);
  proj={x:OX,y:OY,vx:Math.cos(a)*dd*2.9,vy:Math.sin(a)*dd*2.9,rot:0,def:EGGS[Math.min(thrown,4)]};
  eggsLeft--;thrown++;firstThrow=false;sfx.throw();
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',()=>{aiming=false;});
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){press(0);e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){press(1);e.preventDefault();}
});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- boot ---------- */
menu();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>
</body>
</html>
